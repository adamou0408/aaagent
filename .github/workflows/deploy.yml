name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to staging
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "Deploying to staging..."
            mkdir -p ~/.ssh
            echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh -o StrictHostKeyChecking=no deploy@"$DEPLOY_HOST" \
              "docker pull ghcr.io/${{ github.repository }}:latest && \
               docker compose -f docker-compose.staging.yml up -d && \
               sleep 5 && \
               curl -sf http://localhost:3001/health || echo 'WARNING: Health check failed'"
          else
            echo "No staging host configured, skipping deployment."
          fi

      - name: Deploy to production
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "Deploying to production..."
            mkdir -p ~/.ssh
            echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh -o StrictHostKeyChecking=no deploy@"$DEPLOY_HOST" \
              "docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }} && \
               docker compose up -d && \
               sleep 5 && \
               curl -sf http://localhost:3000/health || echo 'WARNING: Health check failed'"
          else
            echo "No production host configured, skipping deployment."
          fi
